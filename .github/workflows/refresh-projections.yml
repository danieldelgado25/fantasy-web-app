# Daily during the NFL season: retrains on fresh data, then commits the projections
# and prediction log. The commit is what publishes them, because the website is
# rebuilt on each push. If training fails, nothing is committed, and if a prediction
# changed after kickoff, nothing is pushed. Either way the site keeps its last good data.
name: Refresh projections

on:
  schedule:
    # 10:17 UTC is before every kickoff that day, and gives stats from the previous
    # day's games time to land. September through February only: no games otherwise.
    # Off the hour on purpose: GitHub can drop scheduled runs set for :00 when busy.
    - cron: "17 10 * 1,2,9-12 *"
  # Allows a manual refresh from the GitHub Actions tab.
  workflow_dispatch:

# Needed to push the commit below.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the freeze check can see every commit to the prediction logs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Train and write projections
        working-directory: backend
        run: python train.py
      - name: Score predictions against actual results
        working-directory: backend
        run: python evaluate.py
      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/predictions frontend/public/data
          git diff --cached --quiet || git commit -m "Refresh projections and prediction log"
      # CI doesn't run on this job's pushes, so the freeze is checked here, before pushing.
      - name: Check no prediction changed after kickoff
        working-directory: backend
        run: python check_freeze.py
      - name: Push
        run: git push
