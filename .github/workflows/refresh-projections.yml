# Daily during the NFL season: retrains on fresh data, then commits the projections
# and prediction log. The commit is what publishes them, because the website is
# rebuilt on each push. If training fails, nothing is committed, and if a prediction
# changed after kickoff, nothing is pushed. Either way the site keeps its last good data.
name: Refresh projections

on:
  schedule:
    # Twice a day, because GitHub has started these runs up to ~8 hours late.
    # 08:17 UTC (3:17am ET): after the previous night's stats land. Even ~8 hours late,
    # it finishes before Sunday's 1pm ET kickoffs.
    # 14:17 UTC (9:17am ET): picks up morning betting-line moves, which reflect injury
    # news, before early kickoffs. Games already started are skipped, so a late run is safe.
    # September through February only: no games otherwise.
    # Off the hour on purpose: GitHub can drop scheduled runs set for :00 when busy.
    - cron: "17 8,14 * 1,2,9-12 *"
  # Allows a manual refresh from the GitHub Actions tab.
  workflow_dispatch:

# Needed to push the commit below.
permissions:
  contents: write

# A late run can overlap the next one. Queue it instead, so two pushes don't collide.
concurrency:
  group: refresh-projections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the freeze check can see every commit to the prediction logs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Train and write projections
        working-directory: backend
        run: python train.py
      - name: Score predictions against actual results
        working-directory: backend
        run: python evaluate.py
      # Writes frontend/public/data/injuries.json, which the commit step below picks up.
      - name: Update the injury news feed
        working-directory: backend
        run: python write_injury_news.py
      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/predictions frontend/public/data
          git diff --cached --quiet || git commit -m "Refresh projections and prediction log"
      # CI doesn't run on this job's pushes, so the freeze is checked here, before pushing.
      - name: Check no prediction changed after kickoff
        working-directory: backend
        run: python check_freeze.py
      - name: Push
        run: git push
