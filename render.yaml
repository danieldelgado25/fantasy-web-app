# DEPRECATED: flagged for manual removal. Projections are now published as a static
# file by .github/workflows/refresh-projections.yml, so no backend host is needed.
services:
  - type: web
    name: fantasy-wr-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn 'api.app:create_app()' --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        sync: false
