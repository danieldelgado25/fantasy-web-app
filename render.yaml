services:
  - type: web
    name: fantasy-wr-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn --factory api.app:create_app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        sync: false
